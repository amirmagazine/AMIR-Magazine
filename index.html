<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMIR Magazine</title>
<meta name="description" content="AMIR Magazine؛ جایی برای انتشار مجله، مقاله و محتوای تصویری">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; connect-src https://api.github.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F0;--sf:#FFFFFF;--sf2:#E3E8E6;--ink:#131A2E;--mut:#566074;--line:#D3DAD7;--anar:#C8274B;--onanar:#fff;--fir:#0B7F78;--saf:#F2B134;--sh:0 1px 0 rgba(19,26,46,.06),0 18px 34px -20px rgba(19,26,46,.45);--fd:Lalezar,Vazirmatn,Tahoma,sans-serif;--fb:Vazirmatn,Tahoma,system-ui,sans-serif}
[data-theme=dark]{--bg:#0B111F;--sf:#151D32;--sf2:#1D2742;--ink:#EDF0F7;--mut:#9CA7BF;--line:#28344F;--anar:#F0577A;--onanar:#0B111F;--fir:#3CCBC1;--sh:0 1px 0 rgba(255,255,255,.04),0 20px 36px -20px rgba(0,0,0,.9)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 var(--fb);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
img,svg{max-width:100%}
:focus-visible{outline:3px solid var(--fir);outline-offset:2px;border-radius:6px}
.skip{position:absolute;top:-60px;inset-inline-start:10px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;z-index:99}
.skip:focus{top:10px}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.ic{width:20px;height:20px;flex:none}
.vb{width:16px;height:16px;vertical-align:-3px;margin-inline-start:3px}
.muted{color:var(--mut)}
.sm{font-size:.875rem}
/* header */
#hd{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:14px;height:64px}
.logo{direction:ltr;font-family:var(--fd);font-size:1.7rem;line-height:1;display:flex;align-items:baseline;gap:6px;letter-spacing:.5px}
.logo b{font-weight:400;color:var(--anar)}
.logo span{font-family:var(--fb);font-size:.8rem;font-weight:700;color:var(--mut);letter-spacing:2px}
.nav{display:flex;gap:4px;margin-inline-start:10px}
.nav a{padding:6px 12px;border-radius:999px;font-weight:500;color:var(--mut)}
.nav a:hover,.nav a[aria-current=page]{color:var(--ink);background:var(--sf2)}
.sp{flex:1}
.hs{display:flex;align-items:center;background:var(--sf2);border-radius:999px;padding:0 12px;gap:6px;min-width:0}
.hs input{background:none;border:0;outline:0;height:38px;width:170px;min-width:0}
.hs:focus-within{outline:3px solid var(--fir)}
.ib{position:relative;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:transparent;cursor:pointer}
.ib:hover{background:var(--sf2)}
.dot{position:absolute;top:3px;inset-inline-start:3px;min-width:18px;height:18px;border-radius:9px;background:var(--anar);color:var(--onanar);font-size:.7rem;display:grid;place-items:center;font-weight:700;padding:0 4px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--sf);font-weight:500;cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{background:var(--sf2)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--anar);border-color:var(--anar);color:var(--onanar);font-weight:700}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dng{color:var(--anar);border-color:var(--anar)}
.btn.sm{min-height:34px;padding:0 12px;font-size:.875rem;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:wait}
.btn[aria-pressed=true]{background:var(--anar);color:var(--onanar);border-color:var(--anar)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center;padding:46px 0 30px}
.mast{direction:ltr;text-align:right;font-family:var(--fd);line-height:.82;font-size:clamp(5.5rem,20vw,12.5rem);letter-spacing:-2px;margin:0}
.mast i{display:block;font-style:normal;font-family:var(--fb);font-size:clamp(1rem,2.4vw,1.5rem);font-weight:700;letter-spacing:.9em;color:var(--anar);margin-top:14px;padding-inline-start:.9em}
.hero h1{margin:0}
.lede{font-size:1.15rem;max-width:34ch;margin:22px 0}
.stack{position:relative;height:430px;direction:ltr}
.stack a{position:absolute;width:56%;aspect-ratio:4/5;border-radius:18px;overflow:hidden;box-shadow:var(--sh);transform:rotate(var(--r)) translate(var(--x),var(--y));animation:deal .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
.stack a:nth-child(1){--r:-7deg;--x:0;--y:10px;--d:0s;inset-inline-start:0;top:20px}
.stack a:nth-child(2){--r:5deg;--x:0;--y:0;--d:.12s;inset-inline-start:30%;top:0}
.stack a:nth-child(3){--r:-2deg;--x:0;--y:0;--d:.24s;inset-inline-start:42%;top:150px;width:52%}
@keyframes deal{from{opacity:0;transform:rotate(0) translate(0,60px)}}
.stack svg,.stack img,.cv svg,.cv img{display:block;width:100%;height:100%;object-fit:cover}
/* sections */
.sec{padding:30px 0}
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px}
h2{font-family:var(--fd);font-weight:400;font-size:clamp(1.7rem,4vw,2.4rem);margin:0;line-height:1.3}
h3{margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:5px 14px;border-radius:999px;background:var(--sf);border:1.5px solid var(--line);font-size:.9rem;cursor:pointer}
.chip:hover,.chip[aria-current=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* magazine cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:34px 24px}
.grid.feat>.card:first-child{grid-column:span 2}
.grid.feat>.card:first-child .cv{aspect-ratio:16/10}
.card .cv{position:relative;display:block;aspect-ratio:4/5;border-radius:20px;overflow:hidden;background:var(--sf2);box-shadow:var(--sh);transition:transform .25s}
.card .cv:hover{transform:translateY(-4px)}
.cat{position:absolute;top:12px;inset-inline-start:12px;background:var(--bg);color:var(--ink);padding:2px 12px;border-radius:999px;font-size:.8rem;font-weight:500}
.card h3{font-family:var(--fd);font-weight:400;font-size:1.45rem;line-height:1.4;margin:14px 0 4px}
.card p{margin:0 0 10px;color:var(--mut);font-size:.95rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.by{display:flex;align-items:center;gap:8px;font-size:.9rem;flex-wrap:wrap}
.stats{display:flex;gap:16px;color:var(--mut);font-size:.85rem;margin-top:8px}
.stats span{display:inline-flex;gap:5px;align-items:center}
.stats .ic{width:16px;height:16px}
.av{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;background:var(--fir);color:#fff;font-weight:700;flex:none;object-fit:cover}
/* forms */
.panel{background:var(--sf);border-radius:24px;padding:28px;box-shadow:var(--sh)}
.narrow{max-width:460px;margin:40px auto}
.fld{display:block;margin-bottom:16px}
.fld>span{display:block;font-weight:500;margin-bottom:4px}
.fld small{color:var(--mut)}
.in{width:100%;min-height:46px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
textarea.in{min-height:140px;resize:vertical}
.in:focus{outline:3px solid var(--fir);outline-offset:1px}
.notice{background:var(--sf2);border-radius:14px;padding:12px 16px;font-size:.92rem;margin:0 0 16px}
.notice.demo{border:1.5px dashed var(--saf)}
.err{color:var(--anar)}
.code{font-family:ui-monospace,monospace;font-size:1.5rem;letter-spacing:6px;direction:ltr;display:block;text-align:center}
/* profile */
.pbanner{height:190px;border-radius:26px;overflow:hidden;box-shadow:var(--sh)}
.pbanner svg{width:100%;height:100%;display:block}
.phead{display:flex;gap:18px;align-items:end;margin:-52px 22px 20px;flex-wrap:wrap}
.phead .av{border:5px solid var(--bg)}
.pcounts{display:flex;gap:22px;margin:10px 0}
.pcounts b{font-size:1.2rem;display:block;line-height:1.2}
/* article */
.art{max-width:760px;margin:0 auto}
.art .acover{border-radius:26px;overflow:hidden;aspect-ratio:16/10;box-shadow:var(--sh);margin:18px 0}
.art .acover svg,.art .acover img{width:100%;height:100%;object-fit:cover;display:block}
.art h1{font-family:var(--fd);font-weight:400;font-size:clamp(2rem,6vw,3.4rem);line-height:1.35;margin:10px 0}
.body p{font-size:1.1rem;line-height:2.1;margin:0 0 1.2em}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:24px 0}
.gal img{width:100%;border-radius:16px;display:block}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 0;border-block:1px solid var(--line);margin:22px 0}
.cm{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.cm p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tags a{color:var(--fir);font-size:.9rem}
/* editor */
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.thumbs div{position:relative;width:96px;height:96px;border-radius:14px;overflow:hidden;background:var(--sf2)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:4px;inset-inline-start:4px;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
/* tables */
.tw{overflow-x:auto;background:var(--sf);border-radius:20px;box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:12px 14px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:700;font-size:.9rem;color:var(--mut)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.stat div{background:var(--sf);border-radius:20px;padding:16px 18px;box-shadow:var(--sh)}
.stat b{display:block;font-family:var(--fd);font-weight:400;font-size:2.2rem;line-height:1.2}
.subnav{display:flex;gap:6px;margin:24px 0;flex-wrap:wrap}
.chart{display:flex;align-items:end;gap:10px;height:130px}
.chart div{flex:1;text-align:center;font-size:.78rem;color:var(--mut)}
.chart i{display:block;background:var(--fir);border-radius:8px 8px 3px 3px;min-height:4px;margin-bottom:4px}
.empty{text-align:center;padding:50px 10px;color:var(--mut)}
.badge{display:inline-block;padding:1px 10px;border-radius:999px;font-size:.78rem;background:var(--sf2)}
.badge.r{background:var(--anar);color:var(--onanar)}
.nt{display:flex;gap:12px;padding:14px 16px;background:var(--sf);border-radius:16px;margin-bottom:10px;align-items:center}
.nt.un{border-inline-start:5px solid var(--anar)}
footer{margin-top:60px;border-top:1px solid var(--line);padding:26px 0 90px;color:var(--mut);font-size:.9rem}
footer .row{justify-content:space-between}
#bn{display:none}
#toasts{position:fixed;bottom:84px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:14px;box-shadow:var(--sh);animation:up .25s both}
.toast.err{background:var(--anar);color:var(--onanar)}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
dialog{border:0;border-radius:22px;padding:24px;background:var(--sf);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.4);max-width:min(440px,92vw);width:100%}
dialog::backdrop{background:rgba(5,8,18,.55)}
@media(max-width:860px){.hero{grid-template-columns:1fr;padding-top:24px}.stack{height:360px;max-width:420px}.nav{display:none}.hs input{width:110px}}
@media(max-width:760px){
 #bn{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:25;background:var(--sf);border-top:1px solid var(--line);justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 #bn a{display:grid;place-items:center;gap:0;font-size:.7rem;padding:2px 10px;color:var(--mut);position:relative}
 #bn a[aria-current=page]{color:var(--anar)}
 .grid.feat>.card:first-child{grid-column:auto}
 .grid.feat>.card:first-child .cv{aspect-ratio:4/5}
 .hide-m{display:none!important}
 .panel{padding:20px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#app">پرش به محتوا</a>
<header id="hd"></header>
<main id="app" class="wrap" tabindex="-1"></main>
<footer><div class="wrap"><div class="row"><span>© AMIR Magazine</span><span class="row"><a href="#/privacy">حریم خصوصی</a><a href="#/terms">شرایط استفاده</a></span></div></div></footer>
<nav id="bn" aria-label="ناوبری موبایل"></nav>
<div id="toasts" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script>
"use strict";
/* ============ utilities ============ */
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean=(s,max)=>String(s??"").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").trim().slice(0,max);
const fa=n=>Number(n||0).toLocaleString("fa-IR");
const fdate=i=>new Intl.DateTimeFormat("fa-IR",{dateStyle:"medium"}).format(new Date(i));
const fdt=i=>new Intl.DateTimeFormat("fa-IR",{dateStyle:"medium",timeStyle:"short"}).format(new Date(i));
const uid=()=>crypto.randomUUID();
const now=()=>new Date().toISOString();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mem={};
const sget=k=>{try{return localStorage.getItem(k)}catch(e){return mem[k]??null}};
const sset=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){if(e&&e.name==="QuotaExceededError")return false;mem[k]=v;return true}};
const tget=k=>{try{return sessionStorage.getItem(k)}catch(e){return mem["s"+k]??null}};
const tset=(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){mem["s"+k]=v}};
const hash=s=>{let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const b64e=u=>btoa(String.fromCharCode(...u));
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const P={
heart:'<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/>',
comment:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
home:'<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/>',
compass:'<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',
shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/>',
settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',
logout:'<path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const VB='<svg class="vb" viewBox="0 0 24 24" role="img" aria-label="حساب تأییدشده"><title>حساب تأییدشده</title><path fill="#1D9BF0" d="M12 1.5l2.6 1.9 3.2-.1 1 3 2.6 1.9-1 3 1 3-2.6 1.9-1 3-3.2-.1L12 22.5l-2.6-1.9-3.2.1-1-3-2.6-1.9 1-3-1-3 2.6-1.9 1-3 3.2.1z"/><path d="m8 12.3 2.7 2.7L16 9.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const vb=u=>u&&u.is_verified?VB:"";
const vip=u=>u&&u.is_vip?`<span class="badge" title="حساب VIP">⭐ VIP</span>`:"";
function toast(m,t){const e=document.createElement("div");e.className="toast "+(t||"");e.textContent=m;$("#toasts").append(e);setTimeout(()=>e.remove(),3600)}
function ask(msg){return new Promise(res=>{const d=$("#dlg");d.returnValue="";d.innerHTML=`<form method="dialog"><p>${esc(msg)}</p><div class="row"><button class="btn pri" value="yes">تأیید</button><button class="btn" value="no">انصراف</button></div></form>`;d.onclose=()=>res(d.returnValue==="yes");d.showModal()})}
function openDlg(html){const d=$("#dlg");d.onclose=null;d.innerHTML=html;d.showModal()}
const closeDlg=()=>{const d=$("#dlg");if(d.open)d.close()};

/* ============ generative covers ============ */
function gen(seed,label){
 const h=hash(seed||"x"),C=[["#0B7F78","#101A33","#F2B134"],["#C8274B","#2B0F2E","#F9D9C6"],["#3550E8","#0E1530","#A8F0E4"],["#F2B134","#3A1B10","#FFF1CF"],["#7A47D8","#170F36","#FFC2DB"],["#0F8A63","#0A2420","#EAF7A6"]][h%6];
 const s=[34,44,56][(h>>4)%3],r=[0,15,30][(h>>6)%3],ch=esc([...String(label||"")][0]||"ا");
 return `<svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="g${h}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${C[0]}"/><stop offset="1" stop-color="${C[1]}"/></linearGradient><pattern id="p${h}" width="${s}" height="${s}" patternUnits="userSpaceOnUse" patternTransform="rotate(${r})"><rect x="${s*.2}" y="${s*.2}" width="${s*.6}" height="${s*.6}" fill="none" stroke="${C[2]}" stroke-width="1.2"/><rect x="${s*.2}" y="${s*.2}" width="${s*.6}" height="${s*.6}" fill="none" stroke="${C[2]}" stroke-width="1.2" transform="rotate(45 ${s/2} ${s/2})"/></pattern></defs><rect width="400" height="500" fill="url(#g${h})"/><rect width="400" height="500" fill="url(#p${h})" opacity=".3"/><circle cx="${120+h%160}" cy="${150+(h>>3)%120}" r="${110+h%50}" fill="${C[1]}" opacity=".55"/><text x="${70+h%40}" y="400" font-family="Lalezar,Vazirmatn,sans-serif" font-size="300" fill="${C[2]}" opacity=".92" style="direction:ltr">${ch}</text></svg>`}
const okUrl=u=>typeof u==="string"&&(/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(u)||/^https:\/\/raw\.githubusercontent\.com\/[\w.\-\/%]+$/.test(u));

async function ghReq(cfg,path,method,body){
 const url=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path.split("/").map(encodeURIComponent).join("/")}`;
 for(let i=0;i<4;i++){
  let r;try{r=await fetch(url+(method==="GET"?"?ref="+encodeURIComponent(cfg.branch):""),{method,headers:{Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},body:body?JSON.stringify(body):undefined})}catch(e){await sleep(700*2**i);continue}
  if(r.ok)return r.json();
  if(r.status===401)throw new Error("توکن GitHub معتبر نیست");
  if(r.status===404&&method==="GET")return null;
  if(r.status===403||r.status===429){const w=+r.headers.get("retry-after")||2**i;if(i<3){await sleep(Math.min(w,8)*1000);continue}throw new Error("محدودیت نرخ GitHub؛ کمی بعد دوباره تلاش کنید")}
  if(r.status>=500){await sleep(700*2**i);continue}
  throw new Error("خطای GitHub ("+r.status+")")}
 throw new Error("ارتباط با GitHub برقرار نشد")}

}

/* ============ components ============ */
function card(m){const a=user(m.author_id)||{};return `<article class="card"><a class="cv" href="#/m/${m.id}" aria-label="${esc(m.title)}">${cover(m)}<span class="cat">${esc(m.category)}</span></a>
 <h3><a href="#/m/${m.id}">${esc(m.title)}</a></h3><p>${esc(m.description)}</p>
 <div class="by">${avatar(a,26)}<a href="#/u/${esc(a.username)}">${esc(a.display_name)}</a>${vb(a)}<span class="muted">${fdate(m.created_at)}</span></div>
 <div class="stats"><span title="لایک">${ic("heart")}${fa(likesOf(m.id))}</span><span title="دیدگاه">${ic("comment")}${fa(cmOf(m.id))}</span><span title="بازدید">${ic("eye")}${fa(m.views)}</span></div></article>`}
const grid=(l,c)=>l.length?`<div class="grid ${c||""}">${l.map(card).join("")}</div>`:`<div class="empty">مجله‌ای پیدا نشد.</div>`;
const paras=t=>String(t).split(/\n{2,}/).map(p=>`<p>${esc(p).replace(/\n/g,"<br>")}</p>`).join("");
const V=(html,o)=>({html,...o});
const need=()=>{const m=ME();if(!m){toast("برای این کار وارد شوید","err");go("/login")}return m};
const fld=(l,n,o={})=>`<label class="fld"><span>${l}</span>${o.area?`<textarea class="in" name="${n}" maxlength="${o.max||1000}" ${o.req?"required":""} placeholder="${o.ph||""}">${esc(o.val||"")}</textarea>`:`<input class="in" name="${n}" type="${o.type||"text"}" value="${esc(o.val||"")}" maxlength="${o.max||200}" ${o.req?"required":""} ${o.ac?`autocomplete="${o.ac}"`:""} ${o.dir?`dir="${o.dir}"`:""} placeholder="${o.ph||""}">`}${o.hint?`<small>${o.hint}</small>`:""}</label>`;

function explore(q){
 const tab=q.get("tab")||"new",cat=q.get("cat")||"",text=clean(q.get("q"),80).toLowerCase(),me=ME();
 let L=db.magazines.filter(m=>!user(m.author_id)?.blocked);
 if(tab==="following"){if(!me){return need(),null}L=L.filter(m=>isFollowing(me.id,m.author_id))}
 if(cat)L=L.filter(m=>m.category===cat);
 if(text)L=L.filter(m=>(m.title+m.description+m.tags.join(" ")).toLowerCase().includes(text));
 L=sorted(tab==="following"?"new":tab,L);
 const T=[["new","جدیدترین"],["pop","محبوب‌ترین"],["likes","بیشترین لایک"],["views","بیشترین بازدید"],["following","دنبال‌شده‌ها"]],
 url=(o)=>"#/explore?"+new URLSearchParams({tab,cat,q:text,...o}).toString().replace(/&?\w+=(&|$)/g,"&").replace(/&$/,"");
 return V(`<section class="sec"><div class="sh"><h2>کاوش</h2></div>
 <form class="hs" data-form="xsearch" role="search" style="margin-bottom:14px;max-width:420px">${ic("search")}<input name="q" type="search" value="${esc(text)}" placeholder="در مجله‌ها جستجو کنید" aria-label="جستجو در مجله‌ها" maxlength="80" style="width:100%"></form>
 <div class="chips" role="tablist" aria-label="مرتب‌سازی">${T.map(t=>`<a class="chip" role="tab" href="${url({tab:t[0]})}" aria-current="${tab===t[0]}">${t[1]}</a>`).join("")}</div>
 <div class="chips" style="margin:12px 0 26px"><a class="chip" href="${url({cat:""})}" aria-current="${!cat}">همه</a>${db.cats.map(c=>`<a class="chip" href="${url({cat:c})}" aria-current="${cat===c}">${esc(c)}</a>`).join("")}</div>
 <div id="eg" class="grid"></div><div id="sent" class="empty" aria-hidden="true"></div></section>`,{title:"کاوش",after(){
  let i=0;const g=$("#eg"),s=$("#sent");
  const more=()=>{const c=L.slice(i,i+9);if(!c.length){s.textContent=i?"به انتها رسیدید":"مجله‌ای با این فیلتر پیدا نشد.";s.removeAttribute("aria-hidden");io.disconnect();return}g.insertAdjacentHTML("beforeend",c.map(card).join(""));i+=9};
  const io=new IntersectionObserver(e=>{if(e[0].isIntersecting)more()},{rootMargin:"300px"});more();io.observe(s)}})}

 ${fld("متن کامل","content",{req:1,max:20000,area:1,val:m?.content,hint:"پاراگراف‌ها را با یک خط خالی جدا کنید."}).replace("class=\"in\"","class=\"in\" style=\"min-height:300px\"")}

function drawThumbs(){

function following(){
 const me=need();if(!me)return null;const ids=db.follows.filter(f=>f.follower_id===me.id).map(f=>f.following_id);

 return V(`<section class="sec"><h2>دنبال‌شده‌ها</h2>${ids.length?`<div class="row" style="margin:16px 0 26px;gap:16px">${ids.map(i=>user(i)).filter(Boolean).map(u=>`<a class="row" href="#/u/${esc(u.username)}" style="gap:8px">${avatar(u,40)}<span>${esc(u.display_name)}${vb(u)}${vip(u)}</span></a>`).join("")}</div>${grid(ms)}`:`<div class="empty">هنوز کسی را دنبال نمی‌کنید. از <a href="#/explore"><u>کاوش</u></a> شروع کنید.</div>`}</section>`,{title:"دنبال‌شده‌ها"})}
function search(q){
 const t=clean(q.get("q"),80),l=t.toLowerCase();

}
function addAdminPowerPanel(){
 if(document.getElementById("ultimate-admin-panel"))return;
 const me=ME();if(!me?.is_admin)return;
 const target=document.querySelector(".sec");if(!target)return;
 const s=adminStats(),p=document.createElement("div");p.id="ultimate-admin-panel";p.className="panel";p.style.marginTop="18px";
 p.innerHTML=`<h3>🧠 مرکز کنترل Ultimate</h3><div class="stat" style="margin:12px 0"><div><b>${fa(s.users)}</b>کاربر</div><div><b>${fa(s.magazines)}</b>مجله</div><div><b>${fa(s.vip)}</b>VIP</div><div><b>${fa(s.views)}</b>بازدید</div><div><b>${fa(s.likes)}</b>لایک</div><div><b>${fa(s.comments)}</b>دیدگاه</div><div><b>${fa(s.reports)}</b>گزارش باز</div></div><div class="row" style="flex-wrap:wrap"><button class="btn" data-act="adashboard">📊 تحلیل کامل</button><button class="btn" data-act="asecurity">🛡️ امنیت</button><button class="btn" data-act="avips">💎 مدیریت VIP</button><button class="btn" data-act="abadges">🏆 نشان‌ها</button><button class="btn" data-act="aexport">📦 پشتیبان کل سایت</button><button class="btn" data-act="ahost">☁️ همگام‌سازی هاست</button></div>`;
 target.appendChild(p)
}

ACTIONS.usave=async el=>{const me=need(),m=mag(el.dataset.id);if(!m)return;const i=db.saved.findIndex(x=>x.user_id===me.id&&x.magazine_id===m.id);if(i>=0)db.saved.splice(i,1);else{db.saved.push({id:uid(),user_id:me.id,magazine_id:m.id,created_at:now()});award(me,"⭐ کتابخانه‌دار",10)}save();try{await hostSync("saved")}catch(e){}render()};
ACTIONS.mexport=el=>{const m=mag(el.dataset.id);if(m)magazineExport(m)};
ACTIONS.mprint=el=>{const m=mag(el.dataset.id);if(m)printMagazine(m)};
ACTIONS.mversion=async el=>{const me=need(),m=mag(el.dataset.id);if(!m||(m.author_id!==me.id&&!me.is_admin))return;createVersion(m,"نسخه دستی");save();toast("نسخه ذخیره شد 🕘")};
ACTIONS.uleader=()=>{const rows=leaderboard().map((u,i)=>`<div class="nt"><b>${fa(i+1)}.</b> ${avatar(u,30)} <span style="flex:1">${esc(u.display_name)} ${vb(u)} ${vip(u)}<br><span class="muted sm">${fa(u.points||0)} امتیاز</span></span></div>`).join("");openDlg(`<h3>🏆 جدول برترین‌ها</h3>${rows||"<p>هنوز امتیازی ثبت نشده.</p>"}<button class="btn" style="margin-top:12px" data-act="closedlg">بستن</button>`) };
ACTIONS.ubadges=()=>{const me=ME();openDlg(`<h3>🎖️ نشان‌های شما</h3><div class="chips">${(me.badges||[]).map(x=>`<span class="badge">${esc(x)}</span>`).join("")||"<span class='muted'>هنوز نشانی نگرفته‌اید.</span>"}</div><button class="btn" style="margin-top:14px" data-act="closedlg">بستن</button>`) };
ACTIONS.usavedlist=()=>{const me=ME(),L=db.saved.filter(x=>x.user_id===me.id).map(x=>mag(x.magazine_id)).filter(Boolean);openDlg(`<h3>⭐ ذخیره‌شده‌ها</h3>${L.map(m=>`<p><a href="#/m/${m.id}" onclick="closeDlg()">${esc(m.title)}</a></p>`).join("")||"<p class='muted'>هنوز چیزی ذخیره نکرده‌اید.</p>"}<button class="btn" style="margin-top:14px" data-act="closedlg">بستن</button>`) };
ACTIONS.ujson=()=>{const me=ME();downloadText("amir-full-backup.json",JSON.stringify({schema:3,exported_at:now(),user:{...me,password_hash:undefined},magazines:db.magazines.filter(m=>m.author_id===me.id),comments:db.comments.filter(c=>c.user_id===me.id),likes:db.likes.filter(l=>l.user_id===me.id),saved:db.saved.filter(x=>x.user_id===me.id),versions:db.versions.filter(x=>x.author_id===me.id)},null,2))};
ACTIONS.theme2=()=>ACTIONS.theme();
ACTIONS.adashboard=()=>{const s=adminStats();openDlg(`<h3>📊 تحلیل کامل</h3><div class="stat"><div><b>${fa(s.users)}</b>کاربر</div><div><b>${fa(s.magazines)}</b>مجله</div><div><b>${fa(s.views)}</b>بازدید</div><div><b>${fa(s.likes)}</b>لایک</div></div><p class="muted" style="margin-top:14px">میانگین بازدید هر مجله: ${fa(s.magazines?Math.round(s.views/s.magazines):0)}</p><button class="btn" style="margin-top:12px" data-act="closedlg">بستن</button>`) };
ACTIONS.asecurity=()=>{needAdmin();const failed=Object.keys(tries).filter(k=>tries[k]?.n).length;openDlg(`<h3>🛡️ مرکز امنیت</h3><p>تلاش‌های ورود ناموفق فعال: <b>${fa(failed)}</b></p><p>احراز هویت مدیر اصلی: <b>رمز دوم فعال</b></p><p>نشست مدیر: <b>${sget("amir_admin2")==="1"?"فعال":"نیازمند رمز دوم"}</b></p><button class="btn" data-act="closedlg">بستن</button>`) };
ACTIONS.avips=()=>{needAdmin();const L=db.users.filter(u=>u.is_vip);openDlg(`<h3>💎 مدیریت VIP</h3><p>تعداد VIP: <b>${fa(L.length)}</b></p>${L.slice(0,30).map(u=>`<div class="nt">${avatar(u,30)}<span>${esc(u.display_name)} <span class="badge">⭐ VIP</span></span></div>`).join("")||"<p class='muted'>هنوز کاربر VIP ندارید.</p>"}<button class="btn" style="margin-top:12px" data-act="closedlg">بستن</button>`) };
ACTIONS.abadges=()=>{needAdmin();const L=[...db.users].sort((a,b)=>(b.badges?.length||0)-(a.badges?.length||0)).slice(0,20);openDlg(`<h3>🏆 نشان‌ها</h3>${L.map(u=>`<div class="nt">${avatar(u,30)}<span style="flex:1">${esc(u.display_name)}</span><b>${fa(u.badges?.length||0)}</b></div>`).join("")}<button class="btn" style="margin-top:12px" data-act="closedlg">بستن</button>`) };
ACTIONS.aexport=()=>{needAdmin();downloadText("amir-site-backup.json",JSON.stringify({schema:3,exported_at:now(),db:{...db,users:db.users.map(u=>{const x={...u};delete x.password_hash;delete x.verify_code;delete x.reset_code;return x})}},null,2))};
ACTIONS.ahost=async()=>{const me=need();if(!AMIR_STORAGE_API)return toast("API هاست تنظیم نشده است","err");await hostSync("admin");toast("همگام‌سازی هاست انجام شد")};

/* publish hooks: versions, streak, achievements, host */
const _saveMagazineForm=FORMS.mag;
FORMS.mag=async function(f,d){
 const me=need(),id=f.dataset.id,old=id?mag(id):null;
 if(old)createVersion(old,"قبل از ویرایش");
 await _saveMagazineForm(f,d);
 updateStreak(me);if(db.magazines.filter(m=>m.author_id===me.id).length>=1)award(me,"📰 نویسنده",20);if(db.magazines.filter(m=>m.author_id===me.id).length>=5)award(me,"🏆 نویسنده فعال",60);
 try{await hostSync("magazine")}catch(e){}
 save();
};

/* automatic streak on login */
const _login=FORMS.login;
FORMS.login=async function(f,d){await _login(f,d);const me=ME();if(me){me.login_count=(me.login_count||0)+1;me.last_login=now();updateStreak(me);if(me.login_count>=10)award(me,"🔥 ۱۰ ورود",30);save()}};


/* ============ boot ============ */
(function(){const t=sget("amir_theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.dataset.theme=t;render()})();
</script>
